<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    // GitHub Pages 镜像站自动跳主站（与 index.html 同一策略）
    (function () {
      var h = location.hostname;
      if (h === 'huoleihu.github.io' || h.indexOf('.github.io') !== -1) {
        var p = location.pathname.replace(/^\/SampleDir\/?/, '/');
        location.replace('https://www.sampledir.com' + p + location.search + location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="meta.title">SampleDir · 更新日志</title>
  <meta name="description" data-i18n-meta="meta.desc" content="SampleDir 版本更新日志：每个版本的新增功能与问题修复。" />
  <link rel="canonical" href="https://www.sampledir.com/changelog.html" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    /* 页面级补充样式：单栏窄版，复用主站变量与配色 */
    .cl-wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
    .cl-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 26px; }
    .cl-head h1 { font-size: clamp(26px, 4vw, 34px); letter-spacing: -.5px; }
    .cl-version { color: var(--green); font-weight: 800; font-size: 15px; background: var(--green-soft); border: 1px solid rgba(0,230,118,.25); border-radius: 999px; padding: 4px 14px; }
    .cl-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 28px; }
    .cl-box ul { list-style: none; margin: 0; padding: 0; }
    .cl-box li { position: relative; padding-left: 20px; margin-bottom: 12px; font-size: 15px; color: var(--text-dim); line-height: 1.7; }
    .cl-box li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .cl-empty, .cl-error { color: var(--text-mute); font-size: 14px; }
    .cl-back { display: inline-block; margin-top: 30px; color: var(--text-dim); font-size: 14px; }
    .cl-back:hover { color: var(--green); }
    .lang { margin-left: auto; }
  </style>
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="/">
        <img src="/assets/img/logo.svg" alt="SampleDir" width="34" height="34" />
        <span class="brand__name">SampleDir</span>
      </a>
      <nav class="nav__links" id="navLinks">
        <a href="/" data-i18n="nav.back">返回首页</a>
        <a href="/#download" data-i18n="nav.download">下载</a>
      </nav>
      <select class="lang" id="langSelect" aria-label="Language / 语言">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
    </div>
  </header>

  <main class="cl-wrap">
    <div class="cl-head">
      <h1 data-i18n="cl.h1">更新日志</h1>
      <span class="cl-version" id="clVersion" hidden></span>
    </div>
    <div class="cl-box">
      <ul id="clList"></ul>
      <p class="cl-empty" id="clEmpty" hidden data-i18n="cl.empty">暂无更新记录。</p>
      <p class="cl-error" id="clError" hidden data-i18n="cl.error">更新记录加载失败，请稍后刷新重试。</p>
    </div>
    <a class="cl-back" href="/" data-i18n="cl.back">← 返回首页</a>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__copy" data-i18n="footer.copy">© 2026 SampleDir · 本地优先的采样素材库管理器</p>
    </div>
  </footer>

  <script>
    // 独立页轻量 i18n：与主站共用 localStorage 偏好键 sampledir_lang，
    // 更新内容来自根目录 version.json 的 notes（ko/ja 缺失时回退 en）。
    (function () {
      var STORE_KEY = 'sampledir_lang';
      var UI = {
        zh: {
          'meta.title': 'SampleDir · 更新日志',
          'meta.desc': 'SampleDir 版本更新日志：每个版本的新增功能与问题修复。',
          'nav.back': '返回首页', 'nav.download': '下载',
          'cl.h1': '更新日志', 'cl.empty': '暂无更新记录。',
          'cl.error': '更新记录加载失败，请稍后刷新重试。',
          'cl.back': '← 返回首页', 'cl.ver': 'v{v}',
          'footer.copy': '© 2026 SampleDir · 本地优先的采样素材库管理器'
        },
        en: {
          'meta.title': 'SampleDir · Changelog',
          'meta.desc': 'SampleDir release notes: new features and fixes in every version.',
          'nav.back': 'Home', 'nav.download': 'Download',
          'cl.h1': 'Changelog', 'cl.empty': 'No release notes yet.',
          'cl.error': 'Failed to load release notes. Please refresh and try again.',
          'cl.back': '← Back to home', 'cl.ver': 'v{v}',
          'footer.copy': '© 2026 SampleDir · Local-first sample library manager'
        },
        ko: {
          'meta.title': 'SampleDir · 업데이트 내역',
          'meta.desc': 'SampleDir 릴리스 노트: 버전별 새 기능과 수정 사항.',
          'nav.back': '홈으로', 'nav.download': '다운로드',
          'cl.h1': '업데이트 내역', 'cl.empty': '업데이트 기록이 없습니다.',
          'cl.error': '업데이트 기록을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.',
          'cl.back': '← 홈으로', 'cl.ver': 'v{v}',
          'footer.copy': '© 2026 SampleDir · 로컬 우선 샘플 라이브러리 관리자'
        },
        ja: {
          'meta.title': 'SampleDir · 更新履歴',
          'meta.desc': 'SampleDir リリースノート：バージョンごとの新機能と修正。',
          'nav.back': 'ホームへ', 'nav.download': 'ダウンロード',
          'cl.h1': '更新履歴', 'cl.empty': '更新記録はまだありません。',
          'cl.error': '更新記録の読み込みに失敗しました。更新して再試行してください。',
          'cl.back': '← ホームへ', 'cl.ver': 'v{v}',
          'footer.copy': '© 2026 SampleDir · ローカルファーストのサンプルライブラリ管理'
        }
      };

      function getLang() {
        try {
          var saved = localStorage.getItem(STORE_KEY);
          if (saved && UI[saved]) return saved;
        } catch (e) {}
        // 无偏好时按浏览器语言；路径式语言页在 changelog 上不区分（本页 URL 唯一）
        var nav = (navigator.language || 'zh-CN').slice(0, 2).toLowerCase();
        return UI[nav] ? nav : 'zh';
      }

      var current = getLang();

      function t(key) {
        var d = UI[current] || UI.zh;
        return d[key] != null ? d[key] : (UI.zh[key] || '');
      }

      function applyUI() {
        document.documentElement.lang = current === 'zh' ? 'zh-CN' : current;
        document.title = t('meta.title');
        var m = document.querySelector('[data-i18n-meta]');
        if (m) m.setAttribute('content', t('meta.desc'));
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var v = t(el.getAttribute('data-i18n'));
          if (v) el.textContent = v;
        });
        var sel = document.getElementById('langSelect');
        if (sel && sel.value !== current) sel.value = current;
      }

      function renderNotes(json) {
        var list = document.getElementById('clList');
        var empty = document.getElementById('clEmpty');
        var err = document.getElementById('clError');
        var verEl = document.getElementById('clVersion');
        if (!list) return;
        if (!json) { err.hidden = false; return; }
        if (verEl && json.version) {
          verEl.textContent = t('cl.ver').replace('{v}', json.version);
          verEl.hidden = false;
        }
        var notes = json.notes || {};
        // 与主站 renderReleaseNotes 相同的回退链：当前语言 → en → zh
        var arr = notes[current] || notes.en || notes.zh || [];
        if (!arr.length) { empty.hidden = false; return; }
        list.innerHTML = '';
        arr.forEach(function (line) {
          var li = document.createElement('li');
          li.textContent = line;
          list.appendChild(li);
        });
      }

      applyUI();

      var sel = document.getElementById('langSelect');
      if (sel) {
        sel.addEventListener('change', function () {
          current = sel.value;
          try { localStorage.setItem(STORE_KEY, current); } catch (e) {}
          applyUI();
          // 语言切换后重新渲染列表（notes 语言随 UI 走）
          if (window.__CL_JSON) { 
            var list = document.getElementById('clList');
            list.innerHTML = '';
            document.getElementById('clEmpty').hidden = true;
            renderNotes(window.__CL_JSON);
          }
        });
      }

      fetch('version.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (json) {
          window.__CL_JSON = json;
          renderNotes(json);
        })
        .catch(function () { renderNotes(null); });
    })();
  </script>
  <script src="/assets/js/track.js" data-site="sampledir" async></script>
</body>
</html>
