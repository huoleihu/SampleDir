<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    // GitHub Pages 镜像站自动跳主站（与 index.html 同一策略）
    (function () {
      var h = location.hostname;
      if (h === 'huoleihu.github.io' || h.indexOf('.github.io') !== -1) {
        var p = location.pathname.replace(/^\/SampleDir\/?/, '/');
        location.replace('https://www.sampledir.com' + p + location.search + location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="meta.title">SampleDir · 更新日志</title>
  <meta name="description" data-i18n-meta="meta.desc" content="SampleDir 版本更新日志：每个版本的新增功能与问题修复。" />
  <link rel="canonical" href="https://www.sampledir.com/changelog.html" />
  <style>
    /* 纯色单栏页面：与隐私政策 / 服务条款一致（浅底、蓝强调、无深色卡片） */
    body { font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Hiragino Sans GB", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.75; }
    h1 { font-size: 24px; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; }
    .ver { display: inline-block; margin: 14px 0 0; color: #3b82f6; font-weight: 700; font-size: 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 999px; padding: 3px 14px; }
    ul.notes { margin: 24px 0 0; padding: 0; list-style: none; }
    ul.notes li { position: relative; padding-left: 18px; margin: 10px 0; font-size: 14px; }
    ul.notes li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; }
    .empty, .error { color: #888; font-size: 14px; margin-top: 22px; }
    .back { display: inline-block; margin-bottom: 18px; color: #3b82f6; font-size: 14px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .switch { margin: 18px 0 0; font-size: 13px; text-align: right; }
    .switch select { font-family: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 6px; color: #333; background: #fff; }
  </style>
</head>
<body>
  <a class="back" href="/" data-i18n="cl.back">← 返回 SampleDir</a>
  <h1 data-i18n="cl.h1">SampleDir 更新日志</h1>
  <span class="ver" id="clVersion" hidden></span>
  <ul class="notes" id="clList"></ul>
  <p class="empty" id="clEmpty" hidden data-i18n="cl.empty">暂无更新记录。</p>
  <p class="error" id="clError" hidden data-i18n="cl.error">更新记录加载失败，请稍后刷新重试。</p>
  <p class="switch"><select id="langSelect" aria-label="Language / 语言">
    <option value="zh">中文</option>
    <option value="en">English</option>
    <option value="ko">한국어</option>
    <option value="ja">日本語</option>
  </select></p>

  <script>
    // 独立页轻量 i18n：与主站共用 localStorage 偏好键 sampledir_lang，
    // 更新内容来自根目录 version.json 的 notes（ko/ja 缺失时回退 en）。
    (function () {
      var STORE_KEY = 'sampledir_lang';
      var UI = {
        zh: {
          'meta.title': 'SampleDir · 更新日志',
          'meta.desc': 'SampleDir 版本更新日志：每个版本的新增功能与问题修复。',
          'cl.h1': 'SampleDir 更新日志', 'cl.empty': '暂无更新记录。',
          'cl.error': '更新记录加载失败，请稍后刷新重试。',
          'cl.back': '← 返回 SampleDir', 'cl.ver': 'v{v}'
        },
        en: {
          'meta.title': 'SampleDir · Changelog',
          'meta.desc': 'SampleDir release notes: new features and fixes in every version.',
          'cl.h1': 'SampleDir Changelog', 'cl.empty': 'No release notes yet.',
          'cl.error': 'Failed to load release notes. Please refresh and try again.',
          'cl.back': '← Back to SampleDir', 'cl.ver': 'v{v}'
        },
        ko: {
          'meta.title': 'SampleDir · 업데이트 내역',
          'meta.desc': 'SampleDir 릴리스 노트: 버전별 새 기능과 수정 사항.',
          'cl.h1': 'SampleDir 업데이트 내역', 'cl.empty': '업데이트 기록이 없습니다.',
          'cl.error': '업데이트 기록을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.',
          'cl.back': '← SampleDir로', 'cl.ver': 'v{v}'
        },
        ja: {
          'meta.title': 'SampleDir · 更新履歴',
          'meta.desc': 'SampleDir リリースノート：バージョンごとの新機能と修正。',
          'cl.h1': 'SampleDir 更新履歴', 'cl.empty': '更新記録はまだありません。',
          'cl.error': '更新記録の読み込みに失敗しました。更新して再試行してください。',
          'cl.back': '← SampleDirへ', 'cl.ver': 'v{v}'
        }
      };

      function getLang() {
        try {
          var saved = localStorage.getItem(STORE_KEY);
          if (saved && UI[saved]) return saved;
        } catch (e) {}
        var nav = (navigator.language || 'zh-CN').slice(0, 2).toLowerCase();
        return UI[nav] ? nav : 'zh';
      }

      var current = getLang();

      function t(key) {
        var d = UI[current] || UI.zh;
        return d[key] != null ? d[key] : (UI.zh[key] || '');
      }

      function applyUI() {
        document.documentElement.lang = current === 'zh' ? 'zh-CN' : current;
        document.title = t('meta.title');
        var m = document.querySelector('[data-i18n-meta]');
        if (m) m.setAttribute('content', t('meta.desc'));
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var v = t(el.getAttribute('data-i18n'));
          if (v) el.textContent = v;
        });
        var sel = document.getElementById('langSelect');
        if (sel && sel.value !== current) sel.value = current;
      }

      function renderNotes(json) {
        var list = document.getElementById('clList');
        var empty = document.getElementById('clEmpty');
        var err = document.getElementById('clError');
        var verEl = document.getElementById('clVersion');
        if (!list) return;
        if (!json) { err.hidden = false; return; }
        if (verEl && json.version) {
          verEl.textContent = t('cl.ver').replace('{v}', json.version);
          verEl.hidden = false;
        }
        var notes = json.notes || {};
        var arr = notes[current] || notes.en || notes.zh || [];
        if (!arr.length) { empty.hidden = false; return; }
        list.innerHTML = '';
        arr.forEach(function (line) {
          var li = document.createElement('li');
          li.textContent = line;
          list.appendChild(li);
        });
      }

      applyUI();

      var sel = document.getElementById('langSelect');
      if (sel) {
        sel.addEventListener('change', function () {
          current = sel.value;
          try { localStorage.setItem(STORE_KEY, current); } catch (e) {}
          applyUI();
          if (window.__CL_JSON) {
            var list = document.getElementById('clList');
            list.innerHTML = '';
            document.getElementById('clEmpty').hidden = true;
            document.getElementById('clError').hidden = true;
            renderNotes(window.__CL_JSON);
          }
        });
      }

      fetch('/version.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (json) {
          window.__CL_JSON = json;
          renderNotes(json);
        })
        .catch(function () { renderNotes(null); });
    })();
  </script>
  <script src="/assets/js/track.js" data-site="sampledir" async></script>
</body>
</html>
